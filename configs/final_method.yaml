# pocketcompare frozen method (do not edit; every file it loads is sha256-verified by pocketcompare.method.Method).
# Adapted from the research repository's configs/final_method.yaml (frozen at commit e5a6f35, tag freeze-v1):
# identical parameters and model files; only file paths changed. Relative paths are resolved against `root`
# (relative to this file's directory).
name: pocketcompare-final:A4b:n1_linear|raw
root: ..
kind: learned
candidate: A4b:n1_linear
variant: raw                 # score = raw inner product (CSLS is available as a search option only)
input: N1
dims: 384
csls_k: 10
parts:
- src: a1
  shaper: sph8
- src: env
  shaper: sph8
site:
  L_cutoff_A: 4.0
  residue_cutoff_A: 4.0
  residue_bur_min: 0.5
  D_pockets: BURROW region-rule output (pk_in_region), each sub-pocket separately
  D_locator_with_site: best-covering region pocket (pockets.best_member, cover 1.5 Å)
  describe_all: merged region-rule pockets (touch <= 1.5 Å or residue Jaccard >= 0.3), >= 10 points
  shaper_sph8:
    radius_A: 8.0
    centroid: vol * bur16^4-weighted
    bur_feature: bur10
    bur_min: 0.5
    empty_fallback: located (base) set
