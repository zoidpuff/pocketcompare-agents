[project]
name = "pocketcompare"
version = "1.0.0"
description = "Fast, ligand-free protein pocket fingerprints (384-d unit vectors) on BURROW pockets: describe, compare and search pockets of PDB entries and AlphaFold models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pocketcompare authors" }]
requires-python = ">=3.11"
keywords = ["protein", "binding site", "pocket similarity", "AlphaFold", "fingerprint", "FAISS"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Versions pinned to the environment in which the method was developed, frozen and evaluated (Python 3.12.3).
# Other versions will probably work but are untested.
# BURROW (burrow-pockets, import name pocketdetect) is not on PyPI: install it first, see README.md.
dependencies = [
    "burrow-pockets==1.0.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# FAISS indices for `pocketcompare index` / `search` (the research environment used faiss-gpu-cu12 1.14.1)
search = ["faiss-cpu==1.14.3"]
# BURROW's GPU featurisation (`--device cuda:N`) and retraining the head (scripts/train_head.py)
gpu = ["torch==2.6.0", "triton==3.2.0"]
train = ["torch==2.6.0"]
test = ["pytest==9.1.1"]

[project.scripts]
pocketcompare = "pocketcompare.cli:main"

[project.urls]
Repository = "https://github.com/[set the final URL]/pocketcompare"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketcompare"]

# the frozen method files travel inside the wheel (pocketcompare/_data); a source checkout reads them in place
[tool.hatch.build.targets.wheel.force-include]
"configs/final_method.yaml" = "pocketcompare/_data/configs/final_method.yaml"
"models" = "pocketcompare/_data/models"

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "models", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
