[project]
name = "pocketcompare"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pocketcompare = "pocketcompare.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
